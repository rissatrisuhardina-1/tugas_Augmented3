```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Kelompok 5 - Minggu 2 (Scene v1)</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Pencahayaan -->
    <a-light
      type="ambient"
      color="#ffffff"
      intensity="0.6">
    </a-light>

    <a-light
      type="directional"
      color="#ffffff"
      intensity="0.8"
      position="1 3 2">
    </a-light>

    <!-- Marker Hiro -->
    <a-marker preset="hiro">

      <!-- Lampu merah -->
      <a-light
        type="point"
        color="#ff5a5a"
        intensity="1.5"
        distance="4"
        position="0 1 0">
      </a-light>

      <!-- Alas scene -->
      <a-plane
        id="alas-ungu"
        position="0 0 0"
        rotation="-90 0 0"
        width="2"
        height="2"
        color="#e9e5fa"
        opacity="0.7"
        transparent="true">
      </a-plane>

      <!-- Kelompok objek 3D -->
      <a-entity id="kelompok-objek">

        <!-- Kubus biru: BERPUTAR -->
        <a-box
          id="kubus-biru"
          position="-0.6 0.25 0"
          width="0.5"
          height="0.5"
          depth="0.5"
          color="#4C6EF5"
          animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 3000; loop: true; easing: linear">
        </a-box>

        <!-- Bola oranye: diam -->
        <a-sphere
          id="bola-oranye"
          position="0 0.3 0"
          radius="0.3"
          color="#D9531E"
          metalness="0.3"
          roughness="0.4">
        </a-sphere>

        <!-- Silinder hijau: diam -->
        <a-cylinder
          id="silinder-hijau"
          position="0.6 0.3 0"
          radius="0.2"
          height="0.6"
          color="#0B7F73">
        </a-cylinder>

        <!-- Kotak bertekstur: diam -->
        <a-box
          id="kotak-tekstur"
          position="0 0.15 0.7"
          width="0.5"
          height="0.3"
          depth="0.5"
          src="assets/tekstur.jpg">
        </a-box>

      </a-entity>

    </a-marker>

    <!-- Kamera AR -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
```
